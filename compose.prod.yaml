# This is an example of how to run the app in production using secret files and
# using the image from GitHub Packages.

name: docs

services:
    server:
        image: 'ghcr.io/olillin/new-docs:latest'
        restart: unless-stopped
        secrets:
            - jwt-secret
            - gamma-client-id
            - gamma-client-secret
            - gamma-api-key-id
            - gamma-api-key-secret
            - database-url
        environment:
            NODE_ENV: production
            BASE_URL: <your base URL>
            JWT_ISSUER: <your domain name>
            # JWT_EXPIRES_IN: 14400
            JWT_SECRET: /run/secrets/jwt-secret
            GAMMA_CLIENT_ID_FILE: /run/secrets/gamma-client-id
            GAMMA_CLIENT_SECRET_FILE: /run/secrets/gamma-client-secret
            GAMMA_API_KEY_ID_FILE: /run/secrets/gamma-api-key-id
            GAMMA_API_KEY_SECRET_FILE: /run/secrets/gamma-api-key-secret
            # GAMMA_REDIRECT_URI: <BASE_URL>/callback
            DATABASE_URL_FILE: /run/secrets/database-url
        volumes:
            - uploads:/app/uploads
        ports:
            - '3000:3000'
        depends_on:
            db:
                condition: service_healthy
    db:
        image: postgres:18
        restart: unless-stopped
        user: postgres
        secrets:
            - postgres-password
        volumes:
            - db-data:/var/lib/postgresql
        environment:
            - POSTGRES_DB=docs
            - POSTGRES_PASSWORD_FILE=/run/secrets/postgres-password
        expose:
            - 5432
        healthcheck:
            test: ['CMD', 'pg_isready']
            interval: 10s
            timeout: 5s
            retries: 5
volumes:
    db-data:
    uploads:
secrets:
    jwt-secret:
        file: secrets/jwt-secret.txt
    gamma-client-id:
        file: secrets/gamma-client-id.txt
    gamma-client-secret:
        file: secrets/gamma-client-secret.txt
    gamma-api-key-id:
        file: secrets/gamma-api-key-id.txt
    gamma-api-key-secret:
        file: secrets/gamma-api-key-secret.txt
    database-url:
        file: secrets/database-url.txt
    postgres-password:
        file: secrets/postgres-password.txt
